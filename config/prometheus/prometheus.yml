global:
  scrape_interval: 15s

scrape_configs:
  # 1. 프로메테우스 자체 모니터링
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. 서버 환경의 백엔드 서비스 연결 (서비스 이름 사용)
  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['backend:8080']

  # 3. PostgreSQL 상태 수집
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # 4. 서버(노드) 상태 수집
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
