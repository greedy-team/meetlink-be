name: meetlink
services:
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  motis:
    image: ghcr.io/motis-project/motis:latest
    container_name: meetlink-motis
    restart: always
    volumes:
      - ./motis-data:/data
    command: /motis server
  backend:
    image: ${APP_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
      motis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAKAO_API_KEY: ${KAKAO_API_KEY}
    profiles: ["deploy"]
  nginx:
    container_name: meetlink-nginx
    image: nginx:alpine
    restart: always
    ports:
      - "443:443"
    volumes:
      - ${NGINX_CERTS_PATH}:/etc/nginx/certs
    depends_on:
      - backend
    profiles: ["deploy"]
volumes:
  postgres-data:
