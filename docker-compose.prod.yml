services:
  postgres:
    container_name: postgres-prod
    restart: unless-stopped
  motis:
    container_name: motis-prod
    restart: unless-stopped
  backend:
    container_name: backend-prod
    restart: unless-stopped
  nginx:
    container_name: nginx-prod
    restart: unless-stopped
    volumes:
      - ./config/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf
