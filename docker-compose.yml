name: meetlink
services:
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  motis-import:
    image: ghcr.io/motis-project/motis:latest
    profiles: ["import"]
    volumes:
      - /srv/meetlink/motis/input:/input
      - ./config/motis/config.yml:/config.yml
      - motis-data:/data
    command: /motis import
  motis:
    image: ghcr.io/motis-project/motis:latest
    restart: always
    volumes:
      - motis-data:/data
    command: /motis server
  backend:
    image: ${APP_IMAGE}
    profiles: ["deploy"]
    depends_on:
      postgres:
        condition: service_healthy
      motis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAKAO_API_KEY: ${KAKAO_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
  nginx:
    image: nginx:alpine
    profiles: ["deploy"]
    restart: always
    ports:
      - "443:443"
    volumes:
      - /srv/meetlink/nginx/certs:/etc/nginx/certs
    depends_on:
      - backend
volumes:
  postgres-data:
  motis-data:
