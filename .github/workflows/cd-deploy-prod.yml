name: CD - Deploy (prod)
on:
  workflow_run:
    workflows: ["CI - Build"]
    types: [completed]
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'release/') }}
    runs-on: self-hosted
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SPRING_PROFILE: prod
          APP_IMAGE: ghcr.io/${{ github.repository }}:prod-latest
          NGINX_CERTS_PATH: ${{ vars.NGINX_CERTS_PATH }}
        run:
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --pull always --remove-orphans
