name: meetlink
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
  motis-import:
    image: ghcr.io/motis-project/motis:latest
    profiles: ["import"]
    volumes:
      - /srv/meetlink/motis/input:/input:ro
      - ./config/motis/config.yml:/config.yml:ro
      - motis-data:/data
    command: /motis import
  motis:
    image: ghcr.io/motis-project/motis:latest
    restart: unless-stopped
    volumes:
      - motis-data:/data
    command: /motis server
  backend:
    image: ${APP_IMAGE}
    profiles: ["deploy"]
    depends_on:
      postgres:
        condition: service_healthy
      motis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAKAO_API_KEY: ${KAKAO_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      DEPLOYMENT_TYPE: stable
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  backend-canary:
    image: ${CANARY_APP_IMAGE}
    profiles: ["canary"]
    depends_on:
      postgres:
        condition: service_healthy
      motis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAKAO_API_KEY: ${KAKAO_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      DEPLOYMENT_TYPE: canary
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  nginx:
    image: nginx:alpine
    profiles: ["deploy"]
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - /srv/meetlink/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3
    restart: unless-stopped
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
  grafana:
    image: grafana/grafana:12.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_USERNAME}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./config/grafana/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      - prometheus
  node-exporter:
    image: prom/node-exporter:v1.7.0
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
volumes:
  postgres-data:
  motis-data:
  prometheus-data:
  grafana-data:
