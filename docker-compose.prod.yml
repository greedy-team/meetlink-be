services:
  postgres:
    container_name: meetlink-db-prod
    restart: unless-stopped
  motis:
    container_name: meetlink-motis-prod
    restart: unless-stopped
  backend:
    container_name: meetlink-be-prod
    restart: unless-stopped
  nginx:
    restart: unless-stopped
    volumes:
      - ./config/nginx.prod.conf:/etc/nginx/conf.d/default.conf
