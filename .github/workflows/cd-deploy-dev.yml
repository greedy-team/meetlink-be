name: CD - Deploy (dev)
on:
  workflow_run:
    workflows: ["CI - Build"]
    types: [completed]
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: [self-hosted, dev]
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SPRING_PROFILE: dev
          APP_IMAGE: ghcr.io/${{ github.repository }}:dev-latest
          NGINX_CERTS_PATH: ${{ vars.NGINX_CERTS_PATH }}
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
          MOTIS_DATA_PATH: ${{ vars.MOTIS_DATA_PATH }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile deploy up -d --pull always --remove-orphans
          docker compose -f docker-compose.yml -f docker-compose.dev.yml restart nginx
