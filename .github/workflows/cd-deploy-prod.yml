name: CD - Deploy (prod)
on:
  workflow_run:
    workflows: ["CI - Build"]
    types: [completed]
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'release/') }}
    runs-on: [self-hosted, prod]
    environment: prod
    env:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SPRING_PROFILES_ACTIVE: prod
      KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GF_USERNAME: ${{ secrets.GF_USERNAME }}
      GF_PASSWORD: ${{ secrets.GF_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        run: |
          NEW_IMAGE=ghcr.io/${{ github.repository }}:prod-${{ github.event.workflow_run.head_sha }}
          CURRENT_STABLE=$(docker inspect backend-prod --format='{{.Config.Image}}' 2>/dev/null || echo "$NEW_IMAGE")

          docker pull $NEW_IMAGE

          APP_IMAGE=$CURRENT_STABLE \
          CANARY_APP_IMAGE=$NEW_IMAGE \
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.canary.yml \
            --profile deploy up -d --remove-orphans

          docker cp config/nginx/nginx.prod.canary.conf nginx-prod:/etc/nginx/conf.d/default.conf
          docker exec nginx-prod nginx -s reload
      - name: Wait for canary health
        id: canary-health
        run: |
          for i in $(seq 1 36); do
            STATUS=$(docker inspect backend-canary-prod --format='{{.State.Health.Status}}' 2>/dev/null || echo "starting")
            [ "$STATUS" = "healthy" ] && echo "Canary is healthy" && exit 0
            [ "$STATUS" = "unhealthy" ] && echo "::error::Canary is unhealthy" && exit 1
            echo "[$i/36] status=$STATUS"
            sleep 5
          done
          echo "::error::Canary health check timed out"
          exit 1
      - name: Rollback on failure
        if: failure()
        run: |
          docker cp config/nginx/nginx.prod.conf nginx-prod:/etc/nginx/conf.d/default.conf
          docker exec nginx-prod nginx -s reload 2>/dev/null || true
          docker rm -f backend-canary-prod 2>/dev/null || true
